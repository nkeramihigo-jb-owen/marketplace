{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
  <div class="form-box">
    <h2>{{ title }}</h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <img id="image-preview" class="preview" alt=""
           {% if product and product.image %}src="{{ product.image.url }}"{% else %}style="display:none"{% endif %}>
      <button type="submit" class="btn">Save</button>
      <a href="{% url 'seller_dashboard' %}">Cancel</a>
    </form>
  </div>
{% endblock %}
