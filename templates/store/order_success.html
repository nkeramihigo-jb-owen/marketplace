{% extends 'base.html' %}
{% block title %}Order placed{% endblock %}
{% block content %}
  <div class="form-box">
    <h2>Thank you!</h2>
    <p>Your order <strong>#{{ order.pk }}</strong> has been placed.</p>
    <p>Total: <strong>{{ order.total }}</strong></p>
    <a href="{% url 'my_orders' %}" class="btn">View my orders</a>
  </div>
{% endblock %}
