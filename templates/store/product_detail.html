{% extends 'base.html' %}
{% block title %}{{ product.title }}{% endblock %}
{% block content %}
  <div class="detail">
    {% if product.image %}<img src="{{ product.image.url }}" alt="{{ product.title }}">{% endif %}
    <div>
      <h1>{{ product.title }}</h1>
      <p class="price">{{ product.price }}</p>
      <p>{{ product.description|linebreaks }}</p>
      <p>Sold by <strong>{{ product.seller.profile }}</strong></p>
      <form method="post" action="{% url 'cart_add' product.pk %}">
  {% csrf_token %}
  <input type="number" name="quantity" value="1" min="1" max="99" class="qty-input">
  <button type="submit" class="btn">Add to cart</button>
</form>
    </div>
  </div>
{% endblock %}
