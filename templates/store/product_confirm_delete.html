{% extends 'base.html' %}
{% block title %}Delete product{% endblock %}
{% block content %}
  <div class="form-box">
    <h2>Delete "{{ product.title }}"?</h2>
    <p>This cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Yes, delete</button>
      <a href="{% url 'seller_dashboard' %}">Cancel</a>
    </form>
  </div>
{% endblock %}
