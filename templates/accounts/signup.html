{% extends 'base.html' %}
{% block title %}Sign up{% endblock %}
{% block content %}
  <div class="form-box">
    <h2>Create an account</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Sign up</button>
    </form>
    <p>Already registered? <a href="{% url 'login' %}">Log in</a></p>
  </div>
{% endblock %}
