{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
  <div class="form-box">
    <h2>Log in</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn">Log in</button>
    </form>
    <p>No account? <a href="{% url 'signup' %}">Sign up</a></p>
  </div>
{% endblock %}
